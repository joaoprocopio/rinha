[package]
name = "rinha"
edition = "2024"
version = "1.0.0"

[dependencies]
tokio = { version = "1.48.0", features = [
    "rt",
    "fs",
    "io-util",
    "signal",
    "parking_lot",
    "macros",
    "socket2"
] }
mimalloc = "0.1.48"
anyhow = "1.0.100"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
axum = "0.8.8"
futures = "0.3.31"
serde = { version = "1.0.228", features = [
    "derive"
] }
serde_json = "1.0.147"
chrono = { version = "0.4.42", features = ["serde"] }

[profile.release]
opt-level = 3
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 16
rpath = false

[profile.dev]
opt-level = 0
debug = false
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false
